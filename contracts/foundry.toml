[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 500
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]

fs_permissions = [{ access = "read-write", path = "./deployments" }]

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[fuzz]
runs = 512

[rpc_endpoints]
qie_mainnet = "${QIE_MAINNET_RPC}"
qie_testnet = "${QIE_TESTNET_RPC}"
